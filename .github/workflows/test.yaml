name: test

on: workflow_dispatch 

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          path: src
      
      - name: Get JDK version
        run: |
          jdk=`jq -r '.jdk127' src/jdk-versions.json`
          echo 12.7 JDK: ${jdk}
  
